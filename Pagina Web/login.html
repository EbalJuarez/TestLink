<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Sistema Odontología</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container auth-container">
      <div class="panel auth-panel">
        <h1>Iniciar sesión</h1>

        <form id="loginForm">
          <label>
            Usuario
            <input name="username" type="text" placeholder="Ingrese su usuario" required />
          </label>

          <label>
            Contraseña
            <input name="password" type="password" placeholder="Ingrese su contraseña" required />
          </label>

          <div class="actions">
            <button type="submit" class="primary">Entrar</button>
            <a href="register.html" class="button-link secondary">Crear cuenta</a>
          </div>
        </form>

        <p id="loginStatus" class="status-ok">Ingrese sus credenciales.</p>
      </div>
    </div>

    <script src="login.js"></script>
  </body>
</html>
